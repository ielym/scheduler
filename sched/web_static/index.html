<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>sched 管理台</title>
<style>
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;margin:0;background:#0f1115;color:#e6e6e6;min-height:100vh}
header{padding:14px 24px;border-bottom:1px solid #1f2330;background:#0f1115;position:sticky;top:0;z-index:100}
header h1{margin:0;font-size:17px;font-weight:600;letter-spacing:.5px}
header .meta{margin-top:4px;font-size:12px;color:#6b7280}
.tabs{display:flex;gap:2px;padding:8px 24px;background:#0f1115;border-bottom:1px solid #1f2330;position:sticky;top:52px;z-index:99}
.tab{padding:7px 14px;border-radius:8px 8px 0 0;cursor:pointer;font-size:13px;color:#8892a8;background:transparent;border:1px solid transparent;transition:all .15s}
.tab:hover{color:#c5cddb;background:#151921}
.tab.active{color:#8ab4ff;background:#181b22;border-color:#2a3547;border-bottom-color:#181b22;font-weight:600}
main{padding:18px 24px;max-width:1600px;margin:0 auto}
.tab-pane{display:none}
.tab-pane.active{display:block}
/* ---------- 全局 ---------- */
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
thead th{text-align:left;padding:9px 12px;color:#94a3b8;font-weight:600;border-bottom:1px solid #1f2330;background:#151921;position:sticky;top:0;z-index:2}
tbody td{padding:9px 12px;border-bottom:1px solid #1a1d27;color:#e6e6e6}
tbody tr:hover td{background:#171a23}
a{color:#8ab4ff;text-decoration:none}
a:hover{text-decoration:underline}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:500;line-height:1.5}
.badge.running{background:rgba(74,222,128,.15);color:#4ade80}
.badge.waiting{background:rgba(251,191,36,.15);color:#fbbf24}
.badge.pending{background:rgba(100,116,139,.2);color:#94a3b8}
.badge.done,.badge.success{background:rgba(138,180,255,.15);color:#8ab4ff}
.badge.failed{background:rgba(248,113,113,.15);color:#f87171}
.badge.stopped{background:rgba(100,116,139,.2);color:#94a3b8}
.badge.disabled{background:rgba(100,116,139,.25);color:#94a3b8}
.badge.enabled{background:rgba(74,222,128,.12);color:#4ade80}
/* ---------- 仪表盘 ---------- */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.stat-card{background:#181b22;border-radius:10px;padding:14px;border:1px solid #1f2330;display:flex;align-items:center;gap:14px}
.stat-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.stat-icon.blue{background:rgba(138,180,255,.12);color:#8ab4ff}
.stat-icon.green{background:rgba(74,222,128,.12);color:#4ade80}
.stat-icon.yellow{background:rgba(251,191,36,.12);color:#fbbf24}
.stat-icon.purple{background:rgba(168,138,255,.12);color:#a88aff}
.stat-icon.red{background:rgba(248,113,113,.12);color:#f87171}
.stat-icon.cyan{background:rgba(34,211,238,.12);color:#22d3ee}
.stat-value{font-size:20px;font-weight:700;line-height:1}
.stat-label{font-size:11px;color:#6b7280;margin-top:3px}
.panel{background:#181b22;border-radius:10px;padding:14px;border:1px solid #1f2330;margin-bottom:14px}
.panel h3{margin:0 0 10px;font-size:12px;color:#94a3b8;font-weight:600;letter-spacing:.5px;text-transform:uppercase}
.resource-row{display:flex;align-items:center;gap:10px;margin-bottom:6px;font-size:12px}
.resource-row .label{width:64px;color:#94a3b8;flex-shrink:0}
.resource-row .bar{flex:1;height:8px;background:#0f1115;border-radius:4px;overflow:hidden;border:1px solid #262b38}
.resource-row .bar-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#22d3ee,#8ab4ff)}
.resource-row .bar-fill.warn{background:linear-gradient(90deg,#fbbf24,#f97316)}
.resource-row .bar-fill.crit{background:linear-gradient(90deg,#ef4444,#b91c1c)}
.resource-row .val{width:110px;text-align:right;color:#cbd5e1;font-variant-numeric:tabular-nums}
/* ---------- 开关 ---------- */
.switch{position:relative;width:38px;height:20px;cursor:pointer;user-select:none;display:inline-block;vertical-align:middle}
.switch input{display:none}
.switch .slider{position:absolute;inset:0;background:#2a3040;border-radius:10px;transition:background .15s}
.switch .slider:before{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;background:#e6e6e6;border-radius:50%;transition:transform .15s}
.switch input:checked + .slider{background:#16a34a}
.switch input:checked + .slider:before{transform:translateX(18px)}
/* ---------- 工具栏 ---------- */
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.toolbar input[type=text],.toolbar select{background:#0f1115;border:1px solid #2a3040;color:#e6e6e6;padding:5px 9px;border-radius:6px;font-size:13px}
.toolbar input[type=text]:focus,.toolbar select:focus{outline:none;border-color:#8ab4ff}
.chip-group{display:flex;gap:4px;flex-wrap:wrap}
.chip{padding:3px 10px;border-radius:12px;font-size:12px;cursor:pointer;border:1px solid #2a3040;background:#0f1115;color:#94a3b8;transition:all .15s}
.chip.active{background:#1e3a8a;border-color:#3b82f6;color:#dbeafe}
.chip:hover{border-color:#404657}
/* ---------- 按钮 ---------- */
.btn{display:inline-block;padding:4px 10px;border:1px solid #2a3040;background:#181b22;color:#cbd5e1;border-radius:6px;font-size:12px;cursor:pointer;transition:all .15s}
.btn:hover{background:#1f2330;color:#fff}
.btn.danger{border-color:#7f1d1d;color:#f87171}
.btn.danger:hover{background:#3f1d1d}
.btn.ghost{border-color:#2a3040;background:transparent;color:#94a3b8}
.btn.ghost:hover{color:#e6e6e6}
.btn[disabled]{opacity:.35;cursor:not-allowed}
/* ---------- 优先级 inline 编辑 ---------- */
.pri-val{font-family:Menlo,monospace;color:#cbd5e1;cursor:pointer;padding:2px 6px;border-radius:4px;border:1px solid transparent;min-width:28px;display:inline-block;text-align:center}
.pri-val:hover{border-color:#2a3040}
.pri-input{width:48px;padding:2px 4px;background:#0f1115;border:1px solid #3b82f6;color:#e6e6e6;border-radius:4px;font-size:13px;text-align:center;font-family:Menlo,monospace}
.pri-input:focus{outline:none}
.pri-save{font-size:11px;color:#3b82f6;margin-left:4px;cursor:pointer}
/* ---------- 分页 ---------- */
.pagination{display:flex;gap:5px;align-items:center;justify-content:center;margin-top:12px;font-size:12px;color:#94a3b8}
.pagination button{background:#181b22;border:1px solid #2a3040;color:#cbd5e1;padding:3px 8px;border-radius:5px;cursor:pointer;font-size:12px}
.pagination button:hover:not(:disabled){background:#1f2330;border-color:#3b82f6}
.pagination button:disabled{opacity:.35;cursor:not-allowed}
/* ---------- 日志弹窗 ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:flex;align-items:center;justify-content:center}
.modal{background:#181b22;border:1px solid #2a3040;border-radius:10px;width:min(900px,95vw);height:min(600px,85vh);display:flex;flex-direction:column}
.modal-head{padding:10px 14px;border-bottom:1px solid #1f2330;display:flex;justify-content:space-between;align-items:center}
.modal-head h3{margin:0;font-size:13px;color:#e6e6e6;font-weight:600}
.modal-head .hint{font-size:11px;color:#6b7280;margin-top:2px}
.modal-body{flex:1;overflow:auto;padding:10px 14px}
pre.log{margin:0;font-size:12px;color:#cbd5e1;white-space:pre-wrap;word-break:break-all;font-family:Menlo,Consolas,monospace;line-height:1.5}
.loading{display:inline-block;width:12px;height:12px;border:2px solid #3b82f6;border-top-color:transparent;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
/* ---------- 时间 ---------- */
.time-col{font-size:12px;color:#cbd5e1;white-space:nowrap;font-variant-numeric:tabular-nums}
.time-col.rel{color:#6b7280}
.rid-col{font-family:Menlo,monospace;font-size:11px;color:#94a3b8;white-space:nowrap}
/* ---------- 状态多选下拉 ---------- */
.status-dropdown{position:relative;display:inline-block}
.status-dropdown-panel{position:absolute;top:calc(100% + 6px);left:0;min-width:160px;background:#181b22;border:1px solid #2a3040;border-radius:8px;padding:6px 0;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.4);display:none}
.status-dropdown.open .status-dropdown-panel{display:block}
.status-dropdown-panel label{display:flex;align-items:center;gap:8px;padding:7px 12px;font-size:13px;color:#cbd5e1;cursor:pointer;user-select:none}
.status-dropdown-panel label:hover{background:#1f2330}
.status-dropdown-panel input[type=checkbox]{accent-color:#8ab4ff;width:14px;height:14px}
</style>
</head>
<body>
<header>
  <h1>sched 管理台</h1>
  <div class="meta" id="meta">加载中…</div>
</header>
<div class="tabs" id="tabs">
  <div class="tab active" data-tab="dashboard">全局仪表盘</div>
  <div class="tab" data-tab="subtasks">子任务管理</div>
  <div class="tab" data-tab="processes">进程管理</div>
</div>
<main>

<!-- ============ Tab 1: 全局仪表盘 ============ -->
<div class="tab-pane active" id="pane-dashboard">
  <div class="stats-grid" id="statsGrid"></div>
  <div class="panel">
    <h3>资源利用率</h3>
    <div class="resource-row"><div class="label">CPU</div><div class="bar"><div class="bar-fill" id="barCpu"></div></div><div class="val" id="valCpu">—</div></div>
    <div class="resource-row"><div class="label">内存</div><div class="bar"><div class="bar-fill" id="barMem"></div></div><div class="val" id="valMem">—</div></div>
  </div>
</div>

<!-- ============ Tab 2: 子任务管理 ============ -->
<div class="tab-pane" id="pane-subtasks">
  <div class="toolbar">
    <button class="btn ghost" onclick="selectAll('subtasksTable',true)">全选</button>
    <button class="btn ghost" onclick="selectAll('subtasksTable',false)">全不选</button>
    <button class="btn ghost" onclick="invertSelect('subtasksTable')">反选</button>
    <button class="btn danger" onclick="batchDeleteSubtasks()">批量删除</button>
    <span style="flex:1"></span>
    <span id="subtaskPagedInfo" style="color:#6b7280;font-size:12px"></span>
  </div>
  <div style="overflow:auto;border:1px solid #1f2330;border-radius:8px">
    <table id="subtasksTable">
      <thead><tr>
        <th style="width:34px"><input type="checkbox" onclick="selectAll('subtasksTable',this.checked)"></th>
        <th>子任务名称</th>
        <th style="width:80px">启用</th>
        <th style="width:120px">优先级 <span style="color:#6b7280;font-weight:normal;font-size:11px">(点击修改)</span></th>
        <th style="width:60px">运行</th>
        <th style="width:60px">等待</th>
        <th style="width:60px">已完成</th>
        <th style="width:60px">失败</th>
        <th style="width:120px">操作</th>
      </tr></thead>
      <tbody></tbody>
    </table>
  </div>
  <div class="pagination" id="subtaskPagination"></div>
</div>

<!-- ============ Tab 3: 进程管理 ============ -->
<div class="tab-pane" id="pane-processes">
  <div class="toolbar">
    <div class="status-dropdown" id="procStatusDropdown">
      <button type="button" class="btn ghost" id="procStatusBtn">状态筛选 ▾</button>
      <div class="status-dropdown-panel" id="procStatusPanel">
        <label><input type="checkbox" value="running"/> 运行中</label>
        <label><input type="checkbox" value="waiting"/> 等待中</label>
        <label><input type="checkbox" value="done"/> 已完成</label>
        <label><input type="checkbox" value="failed"/> 失败</label>
        <label><input type="checkbox" value="stopped"/> 已停止</label>
      </div>
    </div>
    <span id="procStatusHint" style="color:#6b7280;font-size:12px"></span>
    <button class="btn ghost" onclick="selectAll('processesTable',true)">全选</button>
    <button class="btn ghost" onclick="selectAll('processesTable',false)">全不选</button>
    <button class="btn ghost" onclick="invertSelect('processesTable')">反选</button>
    <button class="btn danger" onclick="batchStopProcesses()">批量停止</button>
    <button class="btn danger" onclick="batchDeleteProcesses()">批量删除</button>
    <span style="flex:1"></span>
    <span id="procPagedInfo" style="color:#6b7280;font-size:12px"></span>
  </div>
  <div style="overflow:auto;border:1px solid #1f2330;border-radius:8px">
    <table>
      <thead><tr>
        <th style="width:34px"><input type="checkbox" onclick="selectAll('processesTable',this.checked)"></th>
        <th>子任务</th>
        <th>进程</th>
        <th>状态</th>
        <th>开始时间</th>
        <th>结束时间</th>
        <th style="width:200px">操作</th>
      </tr></thead>
      <tbody id="processesTable"></tbody>
    </table>
  </div>
  <div class="pagination" id="procPagination"></div>
</div>

</main>

<script>
/* ========== 工具 ========== */
const PARAMS = new URLSearchParams(location.search);
const API = '';
function qs(sel,root=document){return root.querySelector(sel)}
function qsa(sel,root=document){return [...root.querySelectorAll(sel)]}
function nowISO(){return new Date().toISOString()}
function debounce(fn,ms=300){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}}
function fmtAbs(s){
  if(!s)return '—';
  try{
    const d=new Date(s);
    const pad=n=>String(n).padStart(2,'0');
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  }catch{return String(s).slice(0,19)}
}
function fmtRel(s){
  if(!s)return '—';try{
    const d=new Date(s), diff=(Date.now()-d)/1000;
    if(diff<0)return fmtAbs(s);  // 未来时间直接给绝对
    if(diff<60)return Math.round(diff)+'s前';
    if(diff<3600)return Math.round(diff/60)+'m前';
    if(diff<86400)return Math.round(diff/3600)+'h前';
    return Math.round(diff/86400)+'d前';
  }catch{return s}}

/* ========== Tab 切换 ========== */
function switchTab(name){
  qsa('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===name));
  qsa('.tab-pane').forEach(p=>p.classList.toggle('active',p.id==='pane-'+name));
  if(name==='dashboard') refreshDashboard(true);
  if(name==='subtasks') refreshSubtasks();
  if(name==='processes') refreshProcesses();
  location.hash='#tab='+name;
}
qsa('.tab').forEach(t=>t.onclick=()=>switchTab(t.dataset.tab));
const _hashTab=(location.hash.match(/tab=(\w+)/)||[])[1];
if(_hashTab){const el=document.querySelector(`.tab[data-tab="${_hashTab}"]`);if(el)el.click()}

/* ========== Dashboard ========== */
async function refreshDashboard(silent=false){
  const [status, procsRes, subRes] = await Promise.all([
    fetch(API+'/api/status').then(r=>r.json()).catch(()=>({})),
    fetch(API+'/api/processes?page_size=1').then(r=>r.json()).catch(()=>({total:0})),
    fetch(API+'/api/subtasks').then(r=>r.json()).catch(()=>[]),
  ]);
  const intents = await fetch(API+'/api/intents').then(r=>r.json()).catch(()=>({}));

  // 汇总
  let pending=0, running=0, done=0, failed=0;
  const perSub={};
  for(const [sid, m] of Object.entries(intents)){
    const c=(perSub[sid]={running:0,waiting:0,done:0,failed:0,total:m.length});
    for(const [rid,info] of Object.entries(m)){
      const st=info.status||'unknown';
      if(st==='pending'){pending++;c.waiting++}
      else if(st==='waiting'){running++}
      else if(st==='running'){running++;c.running++}
      else if(st==='done'||st==='success'){done++;c.done++}
      else if(st==='failed'){failed++;c.failed++}
      else{pending++;c.waiting++}
    }
  }

  // Stat 卡片
  const cards = [
    {icon:'📋', cls:'blue', label:'启用子任务', value:subRes.filter(x=>x.enabled).length+' / '+subRes.length},
    {icon:'⏳', cls:'yellow', label:'等待调度', value:pending},
    {icon:'▶️', cls:'green', label:'运行中', value:running},
    {icon:'✅', cls:'cyan', label:'已完成', value:done},
    {icon:'❌', cls:'red', label:'失败', value:failed},
  ];
  qs('#statsGrid').innerHTML = cards.map(c=>
    `<div class="stat-card"><div class="stat-icon ${c.cls}">${c.icon}</div><div><div class="stat-value">${c.value}</div><div class="stat-label">${c.label}</div></div></div>`
  ).join('');

  // 资源利用率：优先用 actual，fallback reserved
  const cpuTotal = +(status.cpu_total||0);
  const memTotal = +(status.mem_total_mb||0);
  const actualCpu = +(status.actual_cpu||0);
  const actualMem = +(status.actual_mem_mb||0);
  const reservedCpu = +(status.ledger_reserved_cpu||0);
  const reservedMem = +(status.ledger_reserved_mem_mb||0);
  const cpuUsed = actualCpu > 0 ? actualCpu : reservedCpu;
  const memUsed = actualMem > 0 ? actualMem : reservedMem;
  const cpuPct = cpuTotal? Math.min(100, 100*cpuUsed/cpuTotal) : 0;
  const memPct = memTotal? Math.min(100, 100*memUsed/memTotal) : 0;
  const setBar=(id,pct)=>{
    const el=qs('#bar'+id);
    el.style.width=pct+'%';
    el.classList.toggle('warn',pct>=70&&pct<90);
    el.classList.toggle('crit',pct>=90);
  };
  setBar('Cpu',Math.round(cpuPct));
  setBar('Mem',Math.round(memPct));
  qs('#valCpu').textContent = cpuPct.toFixed(1) + '%';
  qs('#valMem').textContent = memPct.toFixed(1) + '%';

  qs('#meta').textContent = '就绪 · ' + new Date().toLocaleTimeString('zh-CN',{hour12:false});
}

/* ========== 子任务管理 ========== */
let subtaskPage=1, subtaskPSize=20, _prevSubKeys='';

async function refreshSubtasks(){
  const all = await fetch(API+'/api/subtasks').then(r=>r.json()).catch(()=>[]);

  const total=all.length, p=subtaskPage, ps=subtaskPSize;
  const start=(p-1)*ps;
  const pageItems=all.slice(start,start+ps);

  // 拿 intents 计数做 per-sid status 徽标
  const intents = await fetch(API+'/api/intents').then(r=>r.json()).catch(()=>({}));

  // 非全量重建：比较 key 集合，只在条目数变了或分页变了时重建
  const keys=all.map(x=>x.subtask_id).join(',');
  const tbody=qs('#subtasksTable tbody');
  const needFullRebuild = tbody.children.length === 0  // 首次
      || (keys !== _prevSubKeys)                       // 条目集合变了
      || tbody.children.length !== pageItems.length;   // 行数不匹配

  if(needFullRebuild){
    _prevSubKeys = keys;
    tbody.innerHTML = '';
    for(const s of pageItems){
      const tr = document.createElement('tr');
      tr.dataset.sid = s.subtask_id;
      tr.innerHTML = subtaskRowHTML(s, intents[s.subtask_id]||{});
      tbody.appendChild(tr);
    }
    // 绑定事件
    tbody.querySelectorAll('input[type=checkbox][data-toggle]').forEach(cb=>{
      cb.addEventListener('change',()=>toggleSubtask(cb.dataset.sid, cb.checked));
    });
    tbody.querySelectorAll('[data-pri-val]').forEach(el=>{
      el.addEventListener('click',()=>enterPriEdit(el));
    });
  } else {
    // 逐条更新：优先级显示、开关、status badge
    for(const s of pageItems){
      const tr = tbody.querySelector(`tr[data-sid="${s.subtask_id}"]`);
      if(!tr){/* 不认识了 → 全量重建 */ tbody.innerHTML=''; return refreshSubtasks();}
      // checkbox
      const cb = tr.querySelector('input[type=checkbox][data-toggle]');
      if(cb && cb.checked !== !!s.enabled){ cb.checked=!!s.enabled; }
      // priority 显示（只在非编辑态时同步）
      const pDiv = tr.querySelector('[data-pri-val]');
      if(pDiv && !pDiv.parentElement.classList.contains('editing')){
        if(pDiv.textContent != s.priority) pDiv.textContent = s.priority;
      }
      // 4 个状态计数单元格
      const c = summarizeIntents(intents[s.subtask_id]||{});
      const tds = tr.querySelectorAll('td');
      tds[4].textContent = c.running || '';
      tds[4].style.color = c.running ? '#4ade80' : '#94a3b8';
      tds[5].textContent = c.waiting || '';
      tds[5].style.color = c.waiting ? '#fbbf24' : '#94a3b8';
      tds[6].textContent = c.done || '';
      tds[6].style.color = c.done ? '#8ab4ff' : '#94a3b8';
      tds[7].textContent = c.failed || '';
      tds[7].style.color = c.failed ? '#f87171' : '#94a3b8';
    }
  }

  qs('#subtaskPagedInfo').textContent = `共 ${total} · 第 ${p}/${Math.max(1,Math.ceil(total/ps))} 页`;
  renderPage('#subtaskPagination', total, p, ps, np=>{subtaskPage=np;refreshSubtasks()});
}

function summarizeIntents(m){
  const c={running:0,waiting:0,done:0,failed:0};
  for(const info of Object.values(m)){
    const st=info.status||'unknown';
    if(st==='pending')c.waiting++;
    else if(st==='running')c.running++;
    else if(st==='done'||st==='success')c.done++;
    else if(st==='failed')c.failed++;
    else c.waiting++;
  }
  return c;
}

function subtaskRowHTML(s, intentsMap){
  const c = summarizeIntents(intentsMap);
  const n = v => v || '';
  return `<tr data-sid="${s.subtask_id}">
    <td><input type="checkbox" data-select value="${s.subtask_id}"></td>
    <td><a href="javascript:void(0)" onclick="openSubtask('${s.subtask_id}')">${s.name||s.subtask_id}</a></td>
    <td><label class="switch"><input type="checkbox" data-toggle data-sid="${s.subtask_id}" ${s.enabled?'checked':''}/><span class="slider"></span></label></td>
    <td><span class="pri-val" data-pri-val data-sid="${s.subtask_id}">${s.priority||0}</span></td>
    <td style="color:${c.running?'#4ade80':'#94a3b8'}">${n(c.running)}</td>
    <td style="color:${c.waiting?'#fbbf24':'#94a3b8'}">${n(c.waiting)}</td>
    <td style="color:${c.done?'#8ab4ff':'#94a3b8'}">${n(c.done)}</td>
    <td style="color:${c.failed?'#f87171':'#94a3b8'}">${n(c.failed)}</td>
    <td><button class="btn danger" onclick="deleteSubtask('${s.subtask_id}')">删除</button></td>
  </tr>`;
}

async function toggleSubtask(sid, wantEnable){
  try{
    const url = wantEnable? API+'/api/start/'+encodeURIComponent(sid) : API+'/api/stop/'+encodeURIComponent(sid);
    const r = await fetch(url,{method:'POST'}).then(r=>r.json());
    if(!wantEnable){
      alert(`已禁用 ${sid}\n· kill running ${(r.killed_running||[]).length} 个\n· 清除 WQ ${r.removed_wq||0} 个\n· 273 个意图已停止，调度器不再自动拉起`);
    }
    refreshDashboard(true); refreshSubtasks();
  }catch(e){ alert('操作失败: '+e.message); refreshSubtasks(); }
}

  </div><div class="modal-body">
    <div style="color:#cbd5e1;margin-bottom:12px;font-size:13px">将停止该任务所有进程，并移除调度器内记录（注册 / 队列 / 意图状态 / 历史 / 日志）。</div>
    <label style="display:flex;align-items:center;gap:8px;color:#8892a8;font-size:13px">

function enterPriEdit(el){
  if(el.parentElement.classList.contains('editing')) return;
  const sid = el.dataset.sid;
  const cur = parseInt(el.textContent,10)||0;
  el.parentElement.classList.add('editing');
  el.outerHTML = `<input class="pri-input" data-pri-input data-sid="${sid}" type="number" min="0" max="100" value="${cur}"/>`;
  const input = qs('.pri-input[data-sid="'+sid+'"]');
  input.focus(); input.select();
  const commit = async (save)=>{
    input.parentElement.classList.remove('editing');
    if(!save){ refreshSubtasks(); return; }
    const v = Math.max(0,Math.min(100,parseInt(input.value,10)||0));
    try{
      await fetch(API+'/api/subtasks/'+encodeURIComponent(sid)+'/priority',{
        method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({priority:v})
      }).then(r=>{if(!r.ok) throw new Error(r.statusText); return r.json();});
      refreshSubtasks();
    }catch(e){ alert('保存失败: '+e.message); refreshSubtasks(); }
  };
  input.addEventListener('keydown', ev=>{
    if(ev.key==='Enter'){ev.preventDefault(); commit(true);}
    else if(ev.key==='Escape'){ev.preventDefault(); commit(false);}
  });
  input.addEventListener('blur', ()=> commit(true));
}

function openSubtask(sid){ window.open('subtask.html?sid='+encodeURIComponent(sid), '_blank'); }

/* ========== 进程管理 ========== */
let procPage=1, procPSize=20;

function _procStatusLabel(s){
  // done 和 success 在界面上统一显示为"已完成"
  if(s==='done'||s==='success') return {label:'已完成', cls:'done'};
  return {label:s, cls:s};
}

async function refreshProcesses(){
  const panel = qs('#procStatusPanel');
  const chosen = [...panel.querySelectorAll('input:checked')].map(cb=>cb.value);
  const statusParam = chosen.length? chosen.join(',') : '';
  const btn = qs('#procStatusBtn');
  btn.textContent = chosen.length? `已选 ${chosen.length} 项 ▾` : '状态筛选 ▾';
  qs('#procStatusHint').textContent = chosen.length? chosen.map(v=>({running:'运行中',waiting:'等待中',done:'已完成',failed:'失败',stopped:'已停止'}[v])||v).join(' / ') : '（不选=全部）';

  const sp = new URLSearchParams({page:procPage,page_size:procPSize});
  if(statusParam) sp.set('status', statusParam);
  const d = await fetch(API+'/api/processes?'+sp).then(r=>r.json()).catch(()=>({items:[],total:0}));

  const items = d.items||[];

  const rows = items.map(i=>{
    const canLog = ['done','success','failed','stopped','running'].includes(i.status);
    const canStop = i.status==='running';
    const started = i.started_at || i.enqueued_at || null;
    const {label, cls} = _procStatusLabel(i.status);
    return `<tr>
      <td><input type="checkbox" data-select value="${i.run_id}"></td>
      <td><a href="javascript:void(0)" onclick="openSubtask('${i.subtask_id}')">${i.subtask_id}</a></td>
      <td>
        <div class="rid-col">${i.run_id}</div>
      </td>
      <td><span class="badge ${cls}">${label}</span></td>
      <td class="time-col">${fmtAbs(started)}</td>
      <td class="time-col">${fmtAbs(i.finished_at)}</td>
      <td>
        ${canLog?`<button class="btn ghost" onclick="showLog('${i.run_id}')">📜 日志</button>`:'<span style="color:#3b4252">—</span>'}
        ${canStop?`<button class="btn danger" onclick="stopProcess('${i.run_id}')" style="margin-left:6px">停止</button>`:''}
        <button class="btn danger" onclick="deleteProcess('${i.run_id}')" style="margin-left:6px">删除</button>
      </td>
    </tr>`;
  }).join('') || `<tr><td colspan="7" style="text-align:center;color:#6b7280;padding:30px">无匹配进程</td></tr>`;
  qs('#processesTable').innerHTML = rows;
  qs('#procPagedInfo').textContent = `共 ${d.total||0} · 第 ${procPage}/${Math.max(1,Math.ceil((d.total||0)/procPSize))} 页`;
  renderPage('#procPagination', d.total||0, procPage, procPSize, np=>{procPage=np;refreshProcesses()});
}

// 状态多选下拉交互
qs('#procStatusBtn').onclick = (e)=>{

};
qs('#procStatusPanel').addEventListener('click', e => e.stopPropagation());

async function stopProcess(rid){
  if(!confirm('确认停止进程 '+rid+' ?')) return;
  try{ await fetch(API+'/api/process/stop/'+encodeURIComponent(rid),{method:'POST'}); refreshProcesses(); refreshDashboard(true); }
  catch(e){ alert('停止失败: '+e.message); }
}

function deleteProcess(rid){
  qs('#delProcModal')?.remove();
  const overlay = document.createElement('div');
  overlay.className='modal-overlay'; overlay.id='delProcModal';
  overlay.innerHTML = `<div class="modal" style="max-width:440px"><div class="modal-head">
    <div><h3>删除进程 ${rid}</h3></div>
    <button class="btn ghost" onclick="document.getElementById('delProcModal').remove()">✕</button>
  </div><div class="modal-body">

    <label style="display:flex;align-items:center;gap:8px;color:#8892a8;font-size:13px">
      <input type="checkbox" id="delProcFiles"> 同时删除该进程的日志与缓存文件
    </label>
    <div style="margin-top:16px;display:flex;gap:8px;justify-content:flex-end">

async function showLog(rid){
  qs('#logModal')?.remove();
  const overlay = document.createElement('div');
  overlay.className='modal-overlay'; overlay.id='logModal';
  overlay.innerHTML = `<div class="modal"><div class="modal-head">
    <div><h3>📜 ${rid}</h3><div class="hint">最近 2MB 尾部 · stdout / stderr 分开</div></div>
    <button class="btn ghost" onclick="document.getElementById('logModal').remove()">✕</button>
  </div>
  <div style="display:flex;gap:2px;padding:6px 16px 0;border-bottom:1px solid #1f2330">
    <button class="tab active" data-stream="stdout" id="logTabStdout">stdout</button>
    <button class="tab" data-stream="stderr" id="logTabStderr">stderr</button>
  </div>
  <div class="modal-body"><span class="loading"></span> 加载中…</div></div>`;
  document.body.appendChild(overlay);

  async function loadStream(stream){
    overlay.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active', b.dataset.stream===stream));
    overlay.querySelector('.modal-body').innerHTML = `<span class="loading"></span> 加载中…`;
    try{
      const resp = await fetch(API+'/api/runs/'+encodeURIComponent(rid)+'/log?stream='+stream);
      if(!resp.ok){ overlay.querySelector('.modal-body').innerHTML=`<pre class="log" style="color:#f87171">HTTP ${resp.status} — ${stream} 日志文件不存在或为空</pre>`; return; }
      const txt = await resp.text();
      const total = resp.headers.get('X-Run-Log-Total-Bytes');
      overlay.querySelector('.modal-body').innerHTML =
        `<div style="margin-bottom:6px;font-size:11px;color:#6b7280">[${stream}] 共 ${total} 字节</div>` +
        `<pre class="log"></pre>`;
      overlay.querySelector('.log').textContent = txt || '（日志为空）';
    }catch(e){
      overlay.querySelector('.modal-body').innerHTML=`<pre class="log" style="color:#f87171">加载失败: ${e.message}</pre>`;
    }
  }
  overlay.querySelector('#logTabStdout').onclick=()=>loadStream('stdout');
  overlay.querySelector('#logTabStderr').onclick=()=>loadStream('stderr');
  await loadStream('stdout');
}

/* ========== 公共 ========== */
function renderPage(sel, total, p, ps, onChg){
  const el=qs(sel); const n=Math.max(1,Math.ceil(total/ps));
  if(n<=1){el.innerHTML='';return}
  const items=[];
  items.push(`<button ${p<=1?'disabled':''} onclick="(${onChg})(${p-1})">‹</button>`);
  const range=[]; for(let i=Math.max(1,p-2);i<=Math.min(n,p+2);i++) range.push(i);
  if(range[0]>1){items.push(`<button onclick="(${onChg})(1)">1</button>`); if(range[0]>2)items.push(`<span style="color:#6b7280">…</span>`)}
  for(const i of range){items.push(`<button onclick="(${onChg})(${i})" style="${i===p?'background:#1e40af;border-color:#3b82f6;color:#dbeafe':''}">${i}</button>`)}
  if(range[range.length-1]<n){if(range[range.length-1]<n-1)items.push(`<span style="color:#6b7280">…</span>`);items.push(`<button onclick="(${onChg})(${n})">${n}</button>`)}
  items.push(`<button ${p>=n?'disabled':''} onclick="(${onChg})(${p+1})">›</button>`);
  el.innerHTML=`<span style="margin-right:6px">共 ${total} · </span>${items.join('')}`;
}

  const tab=qs('.tab.active')?.dataset?.tab;

}, 10000);

/* ========== 批量选择 ========== */
function selectAll(tableId, checked){
  document.querySelectorAll('#'+tableId+' input[type=checkbox][data-select]').forEach(cb=>cb.checked=checked);
}
function invertSelect(tableId){
  document.querySelectorAll('#'+tableId+' input[type=checkbox][data-select]').forEach(cb=>cb.checked=!cb.checked);
}
function selectedIds(tableId){
  return [...document.querySelectorAll('#'+tableId+' input[type=checkbox][data-select]:checked')].map(cb=>cb.value);
}
async function batchDeleteSubtasks(){
  const sids = selectedIds('subtasksTable');
  if(!sids.length) return alert('请先勾选要删除的子任务');
  if(!confirm(`确认删除 ${sids.length} 个子任务？\n（默认不删除本地目录）`)) return;
  let ok=0, fail=0;
  for(const sid of sids){
    try{ await fetch(API+'/api/subtasks/'+encodeURIComponent(sid)+'?delete_dir=false',{method:'DELETE'}).then(r=>{if(!r.ok) throw new Error(r.statusText)}); ok++; }
    catch(e){ fail++; }
  }
  alert(`批量删除完成：成功 ${ok}，失败 ${fail}`);
  refreshDashboard(true); refreshSubtasks();
}
async function batchStopProcesses(){
  const rids = selectedIds('processesTable');
  if(!rids.length) return alert('请先勾选要停止的进程');
  if(!confirm(`确认停止 ${rids.length} 个进程？`)) return;
  let ok=0, fail=0;
  for(const rid of rids){
    try{ await fetch(API+'/api/process/stop/'+encodeURIComponent(rid),{method:'POST'}).then(r=>{if(!r.ok) throw new Error(r.statusText)}); ok++; }
    catch(e){ fail++; }
  }
  alert(`批量停止完成：成功 ${ok}，失败 ${fail}`);
  refreshProcesses(); refreshDashboard(true);
}

}
