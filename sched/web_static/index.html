<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sched · 调度器控制台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235E8BFF'/%3E%3Cpath d='M9 12h14M9 17h8' stroke='%23fff' stroke-width='2.6' stroke-linecap='round'/%3E%3Ccircle cx='21' cy='21' r='3' fill='%232DD4BF'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 32 32" width="26" height="26"><rect width="32" height="32" rx="8" fill="url(#g)"/><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6D9BFF"/><stop offset="1" stop-color="#4F6EF7"/></linearGradient></defs><path d="M9 12h14M9 17h8" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/><circle cx="21" cy="21" r="3" fill="#7EF0DD"/></svg>
      </div>
      <div class="brand-text">
        <span class="brand-name">Sched</span>
        <span class="brand-sub" id="brand-version">调度器</span>
      </div>
    </div>
    <nav class="nav" id="nav">
      <a class="nav-item" href="#/overview" data-view="overview">
        <svg class="ic" viewBox="0 0 24 24"><path d="M4 13h6V4H4v9Zm0 7h6v-4H4v4Zm10 0h6V11h-6v9Zm0-16v4h6V4h-6Z"/></svg>
        <span>总览</span>
      </a>
      <a class="nav-item" href="#/tasks" data-view="tasks">
        <svg class="ic" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10" stroke-linecap="round"/><circle cx="19" cy="18" r="2.4"/></svg>
        <span>任务</span>
        <span class="nav-badge" id="nav-tasks-badge"></span>
      </a>
      <a class="nav-item" href="#/jobs" data-view="jobs">
        <svg class="ic" viewBox="0 0 24 24"><path d="M7 8V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v3M5 8h14a1.5 1.5 0 0 1 1.5 1.5V19a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2V9.5A1.5 1.5 0 0 1 5 8Z"/></svg>
        <span>作业</span>
      </a>
      <a class="nav-item" href="#/attempts" data-view="attempts">
        <svg class="ic" viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>实时执行</span>
        <span class="nav-badge" id="nav-live-badge"></span>
      </a>
    </nav>
    <div class="sidebar-foot">
      <div class="serve-pill" id="serve-pill">
        <span class="dot"></span>
        <span class="serve-label">连接中…</span>
      </div>
      <div class="foot-row">
        <div class="clock" id="clock">--:--:--</div>
        <button class="icon-btn" id="theme-toggle" title="切换浅色 / 深色主题">
          <svg class="ic" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        </button>
        
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar-title">
        <h1 id="page-title">总览</h1>
        <p class="page-sub" id="page-sub"></p>
      </div>

    </header>
    <main id="view" class="view"></main>
  </div>
</div>

<div class="slideover-backdrop" id="slideover-backdrop"></div>
<aside class="slideover" id="slideover" aria-hidden="true">
  <div class="slideover-inner" id="slideover-inner"></div>
</aside>

<div class="modal-backdrop" id="modal-backdrop" hidden>
  <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
</div>

<div class="login-overlay" id="login-overlay" hidden>
  <div class="login-card">
    <div class="brand" style="padding:0 0 18px">
      <div class="brand-mark">
        <svg viewBox="0 0 32 32" width="30" height="30"><rect width="32" height="32" rx="8" fill="url(#g2)"/><defs><linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6D9BFF"/><stop offset="1" stop-color="#4F6EF7"/></linearGradient></defs><path d="M9 12h14M9 17h8" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/><circle cx="21" cy="21" r="3" fill="#7EF0DD"/></svg>
      </div>
      <div class="brand-text"><span class="brand-name">Sched 控制台</span></div>
    </div>
    <p class="muted" style="font-size:12.5px;margin-bottom:14px">此控制台已启用访问令牌鉴权，请输入令牌。</p>
    <input class="input" id="login-token" type="password" placeholder="访问令牌" style="width:100%">
    <button class="btn primary" id="login-submit" style="width:100%;justify-content:center;margin-top:12px">进入控制台</button>
    <p class="login-err" id="login-err"></p>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
