<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sched 管理台</title>
<style>
  :root {
    --bg:#0f141b; --panel:#161d27; --panel2:#1d2632; --line:#2a3543;
    --txt:#d7e0ea; --dim:#8b98a8; --accent:#4da3ff; --ok:#3fbf6f; --warn:#e6b53c;
    --err:#ef5f5f; --purple:#b18cff;
  }
  * { box-sizing:border-box; }
  body { margin:0; font:13px/1.5 -apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
         background:var(--bg); color:var(--txt); }
  header { display:flex; align-items:center; gap:18px; padding:10px 18px; background:var(--panel);
           border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20; }
  header h1 { font-size:15px; margin:0; font-weight:600; }
  header .meta { color:var(--dim); font-size:12px; }
  nav { display:flex; gap:2px; margin-left:auto; }
  nav button { background:transparent; border:0; color:var(--dim); padding:7px 14px; cursor:pointer;
               border-radius:6px; font-size:13px; }
  nav button.active { background:var(--panel2); color:var(--txt); }
  nav button:hover { color:var(--txt); }
  main { padding:18px; max-width:1500px; margin:0 auto; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; margin-bottom:16px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
  .card .k { color:var(--dim); font-size:12px; }
  .card .v { font-size:24px; font-weight:600; margin-top:4px; }
  .card .sub { color:var(--dim); font-size:11px; margin-top:2px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; margin-bottom:16px; }
  .panel h2 { font-size:13px; margin:0; padding:11px 15px; border-bottom:1px solid var(--line);
              display:flex; align-items:center; gap:10px; }
  .panel h2 .spacer { margin-left:auto; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:8px 12px; border-bottom:1px solid var(--line); font-size:12.5px;
           vertical-align:top; }
  th { color:var(--dim); font-weight:500; white-space:nowrap; }
  tr:last-child td { border-bottom:0; }
  tbody tr:hover { background:var(--panel2); }
  .mono { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  button.act { background:var(--panel2); border:1px solid var(--line); color:var(--txt); border-radius:6px;
               padding:4px 10px; cursor:pointer; font-size:12px; margin-right:5px; white-space:nowrap; }
  button.act:hover { border-color:var(--accent); color:var(--accent); }
  button.act.primary { background:var(--accent); border-color:var(--accent); color:#06101d; font-weight:600; }
  button.act.danger { border-color:rgba(239,95,95,.5); color:var(--err); }
  button.act.danger:hover { background:rgba(239,95,95,.12); }
  button.act[disabled] { opacity:.45; cursor:not-allowed; }
  .clickable { cursor:pointer; border-bottom:1px dashed var(--dim); }
  .clickable:hover { color:var(--accent); border-color:var(--accent); }
  .badge { display:inline-block; padding:1px 8px; border-radius:20px; font-size:11px; font-weight:600; }
  .b-ok { background:rgba(63,191,111,.15); color:var(--ok); }
  .b-err { background:rgba(239,95,95,.15); color:var(--err); }
  .b-warn { background:rgba(230,181,60,.15); color:var(--warn); }
  .b-dim { background:rgba(139,152,168,.15); color:var(--dim); }
  .b-purple { background:rgba(177,140,255,.15); color:var(--purple); }
  .b-blue { background:rgba(77,163,255,.15); color:var(--accent); }
  .switch { position:relative; display:inline-block; width:38px; height:20px; }
  .switch input { display:none; }
  .slider { position:absolute; inset:0; background:var(--line); border-radius:20px; cursor:pointer; transition:.15s; }
  .slider:before { content:""; position:absolute; width:14px; height:14px; left:3px; top:3px; background:#fff;
                  border-radius:50%; transition:.15s; }
  .switch input:checked + .slider { background:var(--ok); }
  .switch input:checked + .slider:before { transform:translateX(18px); }
  .bar { background:var(--panel2); border-radius:5px; height:8px; overflow:hidden; margin-top:6px; }
  .bar > i { display:block; height:100%; background:var(--accent); }
  .bar > i.warn { background:var(--warn); } .bar > i.err { background:var(--err); }
  .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:50; display:flex;
              align-items:center; justify-content:center; }
  .modal { background:var(--panel); border:1px solid var(--line); border-radius:12px; width:min(720px,92vw);
           max-height:88vh; display:flex; flex-direction:column; }
  .modal.wide { width:min(1200px,95vw); }
  .modal header2, .mhead { padding:13px 18px; border-bottom:1px solid var(--line); font-weight:600;
                           display:flex; align-items:center; gap:10px; }
  .mbody { padding:16px 18px; overflow:auto; }
  .mfoot { padding:11px 18px; border-top:1px solid var(--line); display:flex; gap:8px; justify-content:flex-end; }
  .x { margin-left:auto; cursor:pointer; color:var(--dim); font-size:17px; } .x:hover{color:var(--txt);}
  input[type=text], input[type=number], select, textarea {
    background:var(--bg); border:1px solid var(--line); color:var(--txt); border-radius:6px;
    padding:6px 9px; font-size:13px; }
  textarea { width:100%; }
  .gate { display:flex; align-items:flex-start; gap:12px; padding:10px 4px; border-bottom:1px solid var(--line); }
  .gate:last-child{border-bottom:0;}
  .dot { width:11px; height:11px; border-radius:50%; margin-top:4px; background:var(--dim); flex:0 0 auto; }
  .dot.run { background:var(--accent); animation:blink 1s infinite; }
  .dot.ok { background:var(--ok); } .dot.fail { background:var(--err); }
  @keyframes blink { 50% { opacity:.25; } }
  .gate .info { flex:1; } .gate .t { font-weight:600; } .gate .r { color:var(--dim); margin-top:2px; word-break:break-all; }
  .gate .el { color:var(--dim); font-size:11px; white-space:nowrap; }
  pre.log { background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:10px;
            height:46vh; overflow:auto; font-size:11.5px; margin:0; white-space:pre-wrap; word-break:break-all; }
  .tabs-mini { display:flex; gap:4px; margin-bottom:8px; }
  .tabs-mini button { background:var(--panel2); border:1px solid var(--line); color:var(--dim);
                      padding:4px 12px; border-radius:6px; cursor:pointer; font-size:12px; }
  .tabs-mini button.active { color:var(--txt); border-color:var(--accent); }
  .toast { position:fixed; bottom:22px; right:22px; z-index:99; display:flex; flex-direction:column; gap:8px; }
  .toast div { background:var(--panel2); border:1px solid var(--line); border-left:3px solid var(--accent);
               padding:9px 15px; border-radius:8px; font-size:12.5px; max-width:380px; }
  .toast div.err { border-left-color:var(--err); } .toast div.ok { border-left-color:var(--ok); }
  .hint { color:var(--dim); font-size:11.5px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .grow { flex:1; }
  .pager { display:flex; gap:10px; align-items:center; padding:9px 15px; border-top:1px solid var(--line); }
  .cfgrow { display:grid; grid-template-columns:150px 200px 1fr; gap:12px; align-items:center;
            padding:7px 0; border-bottom:1px solid var(--line); }
  .cfgrow:last-child { border-bottom:0; }
  .cfgrow .lab { font-weight:600; }
  .cfgrow input, .cfgrow select { width:190px; }
  .cfgwarn { background:rgba(230,181,60,.08); border:1px solid rgba(230,181,60,.35); border-radius:8px;
             padding:9px 12px; color:var(--warn); font-size:12px; margin-bottom:12px; }
  code { background:var(--panel2); padding:1px 5px; border-radius:4px; font-size:11.5px; }
</style>
</head>
<body>
<header>
  <h1>sched 管理台</h1>
  <span class="meta" id="meta">连接中…</span>
  <nav>
    <button data-tab="overview" class="active">总览</button>
    <button data-tab="jobs">任务</button>
    <button data-tab="queue">运行队列</button>
    <button data-tab="runs">历史</button>
    <button data-tab="decisions">决策</button>
    <button data-tab="profiles">画像</button>
  </nav>
</header>
<main id="view"></main>
<div class="toast" id="toast"></div>

<script>
"use strict";
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const api = async (u, opt) => {
  const r = await fetch(u, opt);
  if (!r.ok) { let m = `${r.status}`; try { m = (await r.json()).detail || m; } catch {}
    if (Array.isArray(m)) m = m.map(x=>x.msg||JSON.stringify(x)).join("; ");
    throw new Error(m); }
  return r.json();
};
const toast = (msg, kind="") => {
  const d = document.createElement("div"); if (kind) d.className = kind;
  d.textContent = msg; $("#toast").appendChild(d);
  setTimeout(() => d.remove(), 4200);
};
const post = (u, body) => api(u, {method:"POST", headers:{"Content-Type":"application/json"}, body: body?JSON.stringify(body):"{}"});
const del = (u) => api(u, {method:"DELETE"});

const STATUS_BADGE = {
  success:"b-ok", failed:"b-err", resource:"b-warn", preempted:"b-blue",
  preempt_failed:"b-err", timeout:"b-warn", killed:"b-err", interrupted:"b-purple",
  waiting:"b-dim", running:"b-blue"
};
const badge = s => `<span class="badge ${STATUS_BADGE[s]||"b-dim"}">${esc(s||"-")}</span>`;
const GB_MB = m => m >= 1024 ? (m/1024).toFixed(1)+"GB" : m+"MB";
const hhmmss = iso => (iso||"").replace(/^.*T/,"").replace(/[+-].*$/,"").slice(0,8);
const humanSec = sec => {
  sec = Number(sec)||0;
  if (sec < 60) return `${sec} 秒`;
  if (sec < 3600) return `${Math.round(sec/60)} 分`;
  if (sec < 86400) return `${+(sec/3600).toFixed(1)} 小时`;
  return `${+(sec/86400).toFixed(1)} 天`;
};
const humanDur = sec => "每 " + humanSec(sec);
const WEEK_CN = ["","一","二","三","四","五","六","日"];
// interval 秒数 → 人话调度描述
function fmtSchedule(s) {
  s = s || {};
  const t = s.type || "manual";
  if (t === "manual") return "仅手动触发";
  if (t === "once") return `单次 · ${esc(s.once_at||"-")}`;
  const wk = Array.isArray(s.weekdays) && s.weekdays.length
    ? "（周" + s.weekdays.map(d=>WEEK_CN[d]||d).join("/") + "）" : "";
  if (s.start_time && s.end_time)
    return `每天 ${esc(s.start_time)}–${esc(s.end_time)} ${wk} · ${humanDur(s.interval)}`
      + (s.allow_overrun ? " · 允许超时叠加" : "");
  return `${humanDur(s.interval)}${wk}` + (s.allow_overrun ? " · 允许超时叠加" : "");
}
const fmtDuration = sec => sec == null ? '<span class="hint">无样本</span>' : humanSec(Math.round(sec));

// ---------------- 分页（所有展开列表统一兜底，默认每页 50 条） ----------------
const PAGE_SIZE = 50;
const PG = {};   // 各列表当前页码，按 key 记忆
function pageSlice(items, key) {
  const pages = Math.max(1, Math.ceil(items.length / PAGE_SIZE));
  PG[key] = Math.min(Math.max(1, PG[key] || 1), pages);
  const p = PG[key];
  return { rows: items.slice((p-1)*PAGE_SIZE, p*PAGE_SIZE), p, pages };
}
function pagerHtml(total, p, pages, key) {
  return `<div class="pager"><span class="hint">共 ${total} 条，第 ${p}/${pages} 页（每页 ${PAGE_SIZE} 条）</span>
    <span class="grow"></span>
    <button class="act" data-pg="${key}|prev" ${p<=1?"disabled":""}>上一页</button>
    <button class="act" data-pg="${key}|next" ${p>=pages?"disabled":""}>下一页</button></div>`;
}
function bindPager(rerender) {
  document.querySelectorAll("[data-pg]").forEach(b => b.onclick = () => {
    const [key, dir] = b.dataset.pg.split("|");
    PG[key] = (PG[key] || 1) + (dir === "next" ? 1 : -1);
    rerender();
  });
}

// ---------------- 弹窗 ----------------
function modal(title, bodyHtml, footHtml="", wide=false) {
  const bg = document.createElement("div"); bg.className = "modal-bg";
  bg.innerHTML = `<div class="modal ${wide?'wide':''}">
    <div class="mhead"><span>${title}</span><span class="x">✕</span></div>
    <div class="mbody">${bodyHtml}</div>
    ${footHtml ? `<div class="mfoot">${footHtml}</div>` : ""}</div>`;
  bg.addEventListener("click", e => { if (e.target === bg || e.target.classList.contains("x")) bg.remove(); });
  document.body.appendChild(bg);
  return bg;
}

// ---------------- run 详情 ----------------
function openRun(jobId, runId) {
  const m = modal(`Run <code>${esc(runId)}</code>`,
    `<div id="rd-meta"></div>
     <div class="tabs-mini" style="margin-top:12px">
       <button data-l="stdout" class="active">stdout</button><button data-l="stderr">stderr</button>
       <span class="grow"></span><button class="act" id="rd-refresh">刷新尾部</button></div>
     <pre class="log" id="rd-log">加载中…</pre></div>`,
    `<button class="act" id="rd-close">关闭</button>`, true);
  let stream = "stdout";
  const loadMeta = async () => {
    const r = await api(`/api/runs/${encodeURIComponent(jobId)}/${encodeURIComponent(runId)}`);
    $("#rd-meta",m).innerHTML = `<div class="row">
      <span>${badge(r.status)}</span><b>${esc(r.job_id)}</b>
      <span class="hint">trigger=${esc(r.trigger)} attempt=${esc(r.attempt)} exit=${esc(r.exit_code)}
      开始=${esc(r.started_at||"-")} 结束=${esc(r.finished_at||"-")} 耗时=${Math.round((r.duration_ms||0)/100)/10}s</span></div>
      ${r.reason?`<div class="hint" style="margin-top:6px">${esc(r.reason)}</div>`:""}
      <details style="margin-top:8px"><summary class="hint">完整记录 JSON</summary>
      <pre class="log" style="height:200px">${esc(JSON.stringify(r,null,2))}</pre></details>`;
  };
  const loadLog = async () => {
    const l = await api(`/api/logs/${encodeURIComponent(jobId)}/${encodeURIComponent(runId)}/${stream}?tail=2000`);
    $("#rd-log",m).textContent = l.content || "(空)";
  };
  m.querySelectorAll(".tabs-mini button[data-l]").forEach(b => b.onclick = () => {
    stream = b.dataset.l; m.querySelectorAll(".tabs-mini button").forEach(x=>x.classList.remove("active"));
    b.classList.add("active"); loadLog();
  });
  $("#rd-refresh",m).onclick = loadLog;
  $("#rd-close",m).onclick = () => m.remove();
  loadMeta(); loadLog();
}

// ---------------- 调度参数行内编辑（优先级等纯调度参数，改完立即生效） ----------------
async function openJobConfig(jobId) {
  let cfg;
  try { cfg = await api(`/api/jobs/${encodeURIComponent(jobId)}/config`); }
  catch(e){ toast("读取调度参数失败："+e.message,"err"); return; }
  const s = cfg.schedule || {}, hb = cfg.heartbeat || {}, rt = cfg.retry || {};
  const wd = new Set(s.weekdays || []);
  const wdChecks = [1,2,3,4,5,6,7].map(d =>
    `<label style="margin-right:6px"><input type="checkbox" data-wd="${d}" ${wd.has(d)?"checked":""}>周${WEEK_CN[d]}</label>`).join("");
  const m = modal(`调度参数 · <code>${esc(jobId)}</code>`,
    `<div class="cfgwarn">这里只允许修改纯调度参数，保存后立即生效（不用重启、不用重新过闸）。
      任务代码/入口/资源声明/env 不允许在管理台修改：请在本地改好后重新导入。</div>
     <div class="cfgrow"><div class="lab">优先级</div>
       <input type="number" id="c-pri" value="${esc(cfg.priority)}">
       <div class="hint">整数，越大越先准出（1~100）</div></div>
     <div class="cfgrow"><div class="lab">调度类型</div>
       <select id="c-type">
         <option value="manual" ${s.type==="manual"?"selected":""}>manual（仅手动/CLI 触发）</option>
         <option value="interval" ${s.type==="interval"?"selected":""}>interval（周期）</option>
         <option value="once" ${s.type==="once"?"selected":""}>once（一次性）</option>
       </select><div class="hint">manual 任务只能由「立即运行一次」或 <code>sched run</code> 触发</div></div>
     <div class="cfgrow"><div class="lab">周期间隔（秒）</div>
       <input type="number" id="c-interval" value="${esc(s.interval ?? "")}">
       <div class="hint">interval 用，人话：<span id="c-interval-h"></span></div></div>
     <div class="cfgrow"><div class="lab">每日时间窗</div>
       <div class="row"><input type="text" id="c-start" placeholder="HH:MM" value="${esc(s.start_time||"")}" style="width:90px">
         至 <input type="text" id="c-end" placeholder="HH:MM" value="${esc(s.end_time||"")}" style="width:90px"></div>
       <div class="hint">留空=全天；仅在窗口内按间隔触发</div></div>
     <div class="cfgrow"><div class="lab">生效星期</div><div>${wdChecks}</div>
       <div class="hint">不勾=每天</div></div>
     <div class="cfgrow"><div class="lab">单次时刻</div>
       <input type="text" id="c-once" value="${esc(s.once_at||"")}">
       <div class="hint">once 用，ISO 时间</div></div>
     <div class="cfgrow"><div class="lab">并发实例 / 超时策略</div>
       <div class="row"><input type="number" id="c-maxn" value="${esc(s.max_instances ?? 1)}" style="width:80px">
         <select id="c-overflow" style="width:110px">
           <option value="queue" ${s.overflow==="queue"?"selected":""}>排队</option>
           <option value="skip" ${s.overflow==="skip"?"selected":""}>跳过</option>
         </select>
         <label><input type="checkbox" id="c-overrun" ${s.allow_overrun?"checked":""}> 允许超时叠加</label>
       </div><div class="hint">上一轮没跑完又到点时的处理</div></div>
     <div class="cfgrow"><div class="lab">心跳超时（秒）</div>
       <input type="number" id="c-hb" value="${esc(hb.timeout_sec ?? 120)}">
       <div class="hint">超过该秒数无心跳视为卡死（最小 5 秒）</div></div>
     <div class="cfgrow"><div class="lab">重试间隔（秒）</div>
       <input type="number" id="c-delay" value="${esc(rt.delay_sec ?? 0)}">
       <div class="hint">资源错误（100/101）后按此间隔重试；0=资源一空出来就立刻再试</div></div>
     <div class="cfgrow"><div class="lab">重试上限（次）</div>
       <input type="number" id="c-maxa" value="${esc(rt.max_attempts ?? 0)}">
       <div class="hint">0=不放弃，有资源必须跑完；正数=达到后转人工</div></div>
     <div class="cfgrow"><div class="lab">重试时效截止</div>
       <input type="text" id="c-after" value="${esc(rt.not_after||"")}">
       <div class="hint">留空=不失效；ISO 时刻（如 2026-10-04T18:00）或每日时刻（如 18:00），过期转人工</div></div>`,
    `<button class="act" id="c-cancel">取消</button><button class="act primary" id="c-ok">保存并立即生效</button>`);
  const updHint = () => { $("#c-interval-h",m).textContent = humanSec(Number($("#c-interval",m).value)||0); };
  $("#c-interval",m).oninput = updHint; updHint();
  $("#c-ok",m).onclick = async () => {
    const weekdays = [...m.querySelectorAll("[data-wd]:checked")].map(x=>Number(x.dataset.wd));
    const num = id => { const v = $(id,m).value.trim(); return v===""?undefined:Number(v); };
    const patch = {
      priority: Number($("#c-pri",m).value),
      schedule: {
        type: $("#c-type",m).value,
        interval: num("#c-interval"),
        start_time: $("#c-start",m).value.trim(),
        end_time: $("#c-end",m).value.trim(),
        weekdays,
        once_at: $("#c-once",m).value.trim(),
        max_instances: num("#c-maxn"),
        overflow: $("#c-overflow",m).value,
        allow_overrun: $("#c-overrun",m).checked,
      },
      heartbeat: { timeout_sec: num("#c-hb") },
      retry: { delay_sec: num("#c-delay"), max_attempts: num("#c-maxa"),
               not_after: $("#c-after",m).value.trim() },
    };
    try {
      await post(`/api/jobs/${encodeURIComponent(jobId)}/config`, patch);
      m.remove(); toast("调度参数已保存并立即生效","ok"); loadTab();
    } catch(e){ toast("保存失败："+e.message,"err"); }
  };
  $("#c-cancel",m).onclick = () => m.remove();
}

// ---------------- 各 Tab ----------------
async function tabOverview() {
  const d = await api("/api/overview");
  const memPct = Math.min(100, Math.round((d.machine.total_memory_mb - d.machine.available_memory_mb)/d.machine.total_memory_mb*100));
  const ledPct = Math.min(100, Math.round(d.ledger_reserved_mem_mb/Math.max(1,d.machine.total_memory_mb)*100));
  const tasks = await api("/api/tasks");
  const pending = tasks.filter(t => !t.registered);
  const admRows = pending.map(t => {
    const a = t.admission;
    let badgeHtml, detail;
    if (!t.has_task_json) { badgeHtml = '<span class="badge b-err">缺少 task.json</span>'; detail = "放入合规的 task.json 后自动开始检查"; }
    else if (!a) { badgeHtml = '<span class="badge b-dim">等待检查</span>'; detail = "下一轮热加载时自动开始（≤30s）"; }
    else if (a.status === "checking") { badgeHtml = '<span class="badge b-blue">检查中</span>'; detail = "正在执行上线检查（静态/契约/冒烟/容量/断点）…"; }
    else { badgeHtml = `<span class="badge b-err">未通过（已检查 ${a.attempts} 次）</span>`;
           detail = `${esc(a.reason||"")}<br><span class="hint">不做定时自动重试：请在本地修改/删除任务文件，文件变化后自动重新检查</span>`; }
    return `<tr><td class="mono">${esc(t.id)}</td><td>${badgeHtml}</td>
      <td class="hint" style="max-width:760px">${detail}</td></tr>`;
  }).join("");
  const admPanel = !pending.length ? "" : `
    <div class="panel"><h2>等待上线检查的任务（${pending.length}）
      <span class="spacer"></span><span class="hint">任务放进 tasks/ 即自动检查，通过后自动开始调度；闸失败不自动重试，改文件后重查</span></h2>
      <table><thead><tr><th>任务</th><th>检查状态</th><th>说明 / 未通过原因</th></tr></thead>
      <tbody>${admRows}</tbody></table></div>`;
  $("#view").innerHTML = `
    <div class="cards">
      <div class="card"><div class="k">已纳入调度任务</div><div class="v">${d.jobs}</div></div>
      <div class="card"><div class="k">等待运行</div><div class="v">${d.waiting}</div></div>
      <div class="card"><div class="k">运行中</div><div class="v">${d.running}</div></div>
      <div class="card"><div class="k">整机内存</div><div class="v">${GB_MB(d.machine.available_memory_mb)}</div>
        <div class="sub">可用 / 共 ${GB_MB(d.machine.total_memory_mb)}（${memPct}% 占用）</div>
        <div class="bar"><i class="${memPct>85?'err':memPct>65?'warn':''}" style="width:${memPct}%"></i></div></div>
      <div class="card"><div class="k">CPU</div><div class="v">${d.machine.total_cpu}</div><div class="sub">核（时区固定 Asia/Shanghai）</div></div>
      <div class="card"><div class="k">账本预留</div><div class="v">${d.ledger_reserved_mem_mb}MB</div>
        <div class="sub">实测 ${d.ledger_actual_mem_mb}MB · 占整机 ${ledPct}%</div>
        <div class="bar"><i class="${ledPct>85?'err':ledPct>65?'warn':''}" style="width:${ledPct}%"></i></div></div>
    </div>
    ${admPanel}`;
}

async function tabJobs() {
  const [jobs, tasks] = await Promise.all([api("/api/jobs"), api("/api/tasks")]);
  const regIds = new Set(jobs.map(j=>j.job_id));
  const unreg = tasks.filter(t => !regIds.has(t.id));
  const row = j => {
    const sch = j.schedule||{};
    const isManual = (sch.type || "manual") === "manual";
    const runBtn = isManual
      ? `<button class="act primary" data-run="${esc(j.job_id)}" ${j.ok?"":"disabled"}>立即运行一次</button>`
      : `<span class="hint" title="自动调度任务由调度器按计划运行，无需手动触发">按计划自动运行</span>`;
    return `<tr>
      <td class="mono"><b>${esc(j.job_id)}</b><div class="hint">${esc(j.name||"")}</div></td>
      <td><span class="clickable" data-cfg="${esc(j.job_id)}" title="点击修改优先级等调度参数">${j.priority}</span></td>
      <td><span class="badge b-purple">${esc(sch.type||"manual")}</span>
          <div class="hint">${fmtSchedule(sch)}</div></td>
      <td class="mono">${esc(j.next_run_at||"-")}</td>
      <td>${j.ok?'<span class="badge b-ok">ok</span>':
              `<span class="badge b-err" title="${esc(j.error||'')}">异常</span>
               <div class="hint" style="max-width:230px">${esc((j.error||"").slice(0,90))}</div>`}</td>
      <td><label class="switch"><input type="checkbox" ${j.enabled?"checked":""} data-en="${esc(j.job_id)}">
          <span class="slider"></span></label></td>
      <td>
        ${runBtn}
        <button class="act" data-cfg="${esc(j.job_id)}">调度参数</button>
      </td></tr>`;
  };
  const unregRow = t => {
    const a = t.admission;
    let statusCell, hintCell;
    if (!t.has_task_json) {
      statusCell = '<span class="badge b-err">缺少 task.json</span>';
      hintCell = "放入合规的 task.json 后自动开始检查";
    } else if (!a) {
      statusCell = '<span class="badge b-dim">等待检查</span>';
      hintCell = "≤30s 内自动开始上线检查";
    } else if (a.status === "checking") {
      statusCell = '<span class="badge b-blue">检查中…</span>';
      hintCell = "正在跑五道闸（静态/契约/冒烟/容量/断点）";
    } else {
      statusCell = `<span class="badge b-err">未通过 · 已检查 ${a.attempts} 次</span>`;
      hintCell = `${esc((a.reason||"").slice(0,200))}<br><span class="hint">闸失败不自动重试：本地修改任务文件后自动重新检查</span>`;
    }
    return `<tr><td class="mono"><b>${esc(t.id)}</b></td><td>${statusCell}</td>
      <td class="hint" style="max-width:720px">${hintCell}</td></tr>`;
  };
  $("#view").innerHTML = `
    <div class="panel"><h2>已纳入调度的任务
      <span class="spacer"></span>
      <button class="act primary" id="import-task">+ 导入任务</button></h2>
      <table><thead><tr><th>任务</th><th>优先级</th><th>调度</th><th>下次运行</th><th>状态</th><th>启用</th><th>操作</th></tr></thead>
      <tbody>${jobs.map(row).join("") || `<tr><td colspan="7" class="hint" style="padding:18px">暂无任务（点右上角「导入任务」，或把任务目录放进 tasks/ 自动过闸）</td></tr>`}</tbody></table></div>
    ${unreg.length ? `<div class="panel"><h2>等待上线检查（${unreg.length}）
      <span class="spacer"></span><span class="hint">全自动：检查通过即开始调度；未通过请在本地改文件，文件变化后自动重查</span></h2>
      <table><thead><tr><th>任务</th><th>检查状态</th><th>说明 / 未通过原因</th></tr></thead>
      <tbody>${unreg.map(unregRow).join("")}</tbody></table></div>`:""}`;
  document.querySelectorAll("[data-run]").forEach(b => b.onclick = async () => {
    try { const r = await post(`/api/jobs/${encodeURIComponent(b.dataset.run)}/trigger`);
      toast(`已加入运行队列：${r.run_id}`, "ok"); } catch(e){ toast("运行失败："+e.message,"err"); }
  });
  document.querySelectorAll("[data-cfg]").forEach(b => b.onclick = () => openJobConfig(b.dataset.cfg));
  document.querySelectorAll("[data-en]").forEach(c => c.onchange = async () => {
    try { await post(`/api/jobs/${encodeURIComponent(c.dataset.en)}/enabled`, {enabled:c.checked});
      toast(c.checked?"已启用":"已停用（≤30s 生效）","ok"); } catch(e){ toast(e.message,"err"); c.checked=!c.checked; }
  });
  $("#import-task").onclick = () => {
    const m = modal("导入任务",
      `<div class="cfgwarn">仅限<b>本地已开发验证的生产级任务</b>：按 <code>tasks/</code> 下的子任务目录名导入，
        导入即同步执行五道上线检查（静态/契约/冒烟/容量/断点），通过后立即纳入调度；
        未通过会显示闸门原因，本地改好文件后自动重查。管理台不提供文件查看/编辑。</div>
       <input type="text" id="im-name" placeholder="子任务目录名（字母数字 _ -，1-64 位）" style="width:100%" autofocus>
       <div class="hint" style="margin-top:8px">目录需已存在于 tasks/ 且包含 task.json，例如：arxiv_agentic_daily</div>`,
      `<button class="act" id="im-cancel">取消</button><button class="act primary" id="im-ok">导入并过闸</button>`);
    const submit = async () => {
      const name = $("#im-name",m).value.trim();
      if (!name) { toast("请填写目录名","err"); return; }
      $("#im-ok",m).disabled = true;
      try { await post("/api/tasks", {dir_name:name}); m.remove();
            toast("导入成功，已纳入调度：" + name, "ok"); loadTab(); }
      catch(e){ toast("导入失败："+e.message,"err"); $("#im-ok",m).disabled = false; }
    };
    $("#im-cancel",m).onclick = () => m.remove();
    $("#im-ok",m).onclick = submit;
    $("#im-name",m).onkeydown = e => { if (e.key==="Enter") submit(); };
  };
}

async function tabQueue() {
  const q = await api("/api/queue");
  const lastCell = it => {
    const l = it.last;
    if (!l) return '<span class="hint">首次运行</span>';
    const text = l.message || l.reason || "";
    return `${badge(l.status)}<div class="hint" style="max-width:340px" title="${esc(text)}">${esc(text.slice(0,120))}</div>
      <div class="hint">${esc(hhmmss(l.finished_at))}</div>`;
  };
  const waitCell = it => {
    if (it.not_before) {
      const t = hhmmss(it.not_before);
      return `<span class="badge b-warn" title="任务在 task.json retry.delay_sec 中声明的重试节奏">
        等待任务重试间隔 · ${esc(t)} 后可准出</span>`;
    }
    return '<span class="hint">排队等待资源/调度</span>';
  };
  const trigCell = it => it.trigger==="manual"
    ? '<span title="由管理台「立即运行一次」或 sched run 手动触发（manual=true）">手动运行</span>'
    : it.trigger==="interval" ? "按计划" : it.trigger==="once" ? "单次计划" : it.trigger==="second_pass" ? "二刷" : esc(it.trigger);
  const wRow = it => `<tr>
    <td class="mono">${esc(it.job_id)}</td><td>${it.priority}</td>
    <td><span class="hint">${trigCell(it)}</span></td>
    <td>${it.attempt}</td><td>${it.resume_point_ref?'<span class="badge b-blue">断点恢复</span>':""}</td>
    <td class="mono">${esc(hhmmss(it.queued_at))}</td><td>${waitCell(it)}</td><td>${lastCell(it)}</td></tr>`;
  const rRow = it => `<tr>
    <td class="mono">${esc(it.job_id)}</td>
    <td>${badge("running")} <span class="hint">${it.trigger==="manual"?"手动运行":"按计划"}</span></td>
    <td class="mono">${esc(it.run_id)}</td><td>${it.pid}</td>
    <td><div>${it.est_cpu} 核 / ${it.est_mem_mb}MB</div>
        <div class="hint">实测 ${it.live_cpu_cores??"–"} 核 / ${it.live_mem_mb??"–"}MB</div></td>
    <td class="mono">${esc(hhmmss(it.started_at))}</td>
    <td><button class="act danger" data-stop="${esc(it.job_id)}|${esc(it.run_id)}">停止</button></td></tr>`;
  const wp = pageSlice(q.waiting, "q-wait");
  const rp = pageSlice(q.running, "q-run");
  $("#view").innerHTML = `
    <div class="panel"><h2>等待运行（${q.waiting.length}）
      <span class="spacer"></span><span class="hint">「手动运行」= 管理台「立即运行一次」或 <code>sched run</code> 触发；尝试次数=本次计划第几次尝试；同优先级按预估时长短作业优先（SJF）</span></h2>
      <table><thead><tr><th>任务</th><th>优先级</th><th>触发方式</th><th>第几次尝试</th><th>恢复</th><th>入队时刻</th><th>等待状态</th><th>上次失败原因</th></tr></thead>
      <tbody>${wp.rows.map(wRow).join("") || '<tr><td colspan="8" class="hint" style="padding:16px">没有等待运行的任务</td></tr>'}</tbody></table>
      ${q.waiting.length > PAGE_SIZE ? pagerHtml(q.waiting.length, wp.p, wp.pages, "q-wait") : ""}</div>
    <div class="panel"><h2>运行中（${q.running.length}）
      <span class="spacer"></span><span class="hint">「停止」= 请求取消（SIGTERM 整进程组，可断点续跑；本轮不自动重排队）</span></h2>
      <table><thead><tr><th>任务</th><th>状态</th><th>run_id</th><th>pid</th><th>资源（预估/实测）</th><th>开始</th><th>操作</th></tr></thead>
      <tbody>${rp.rows.map(rRow).join("") || '<tr><td colspan="7" class="hint" style="padding:16px">无运行中任务</td></tr>'}</tbody></table>
      ${q.running.length > PAGE_SIZE ? pagerHtml(q.running.length, rp.p, rp.pages, "q-run") : ""}</div>`;
  bindPager(loadTab);
  document.querySelectorAll("[data-stop]").forEach(b => b.onclick = async () => {
    if (!confirm("确认停止该运行？将发送 SIGTERM（任务可保存断点，本轮结束后不自动重排队）。")) return;
    const [j, rid] = b.dataset.stop.split("|");
    b.disabled = true; b.textContent = "停止中…";
    try { await post(`/api/runs/${encodeURIComponent(j)}/${encodeURIComponent(rid)}/stop`);
      toast("已发送停止请求","ok"); }
    catch(e){ toast("停止失败："+e.message,"err"); b.disabled=false; b.textContent="停止"; }
  });
}

async function tabRuns() {
  const jobId = $("#rf-job")?.value || ""; const status = $("#rf-status")?.value || "";
  const qs = new URLSearchParams(); if (jobId) qs.set("job_id",jobId); if (status) qs.set("status",status); qs.set("limit","1000");
  const runs = await api("/api/runs?"+qs.toString());
  const askDelete = (job_id, run_id) => {
    const m = modal(`删除历史 · <code>${esc(run_id)}</code>`,
      `<div class="cfgwarn">删除后不可恢复。是否同步删除本地详情与日志？</div>
       <div class="hint">· 「仅删除历史记录」：从 data/runs/${esc(job_id)}.jsonl 移除该行，日志文件保留在磁盘；<br>
       · 「同时删除本地详情和日志」：额外删除 data/runs/${esc(job_id)}/ 下该 run 的 stdout/stderr 日志。<br>
       · state/cache/results 等任务产物不受影响。</div>`,
      `<button class="act" id="dl-cancel">取消</button>
       <button class="act" id="dl-row">仅删除历史记录</button>
       <button class="act danger" id="dl-all">同时删除本地详情和日志</button>`);
    const doDel = async (withFiles, btn) => {
      btn.disabled = true;
      try {
        await del(`/api/runs/${encodeURIComponent(job_id)}/${encodeURIComponent(run_id)}?delete_files=${withFiles}`);
        m.remove(); toast(withFiles ? "已删除记录和本地日志" : "已删除历史记录","ok"); loadTab();
      } catch(e){ toast("删除失败："+e.message,"err"); btn.disabled=false; }
    };
    $("#dl-cancel",m).onclick = () => m.remove();
    $("#dl-row",m).onclick = () => doDel(false, $("#dl-row",m));
    $("#dl-all",m).onclick = () => doDel(true, $("#dl-all",m));
  };
  const render = () => {
    const pg = pageSlice(runs, "runs");
    $("#view").innerHTML = `
    <div class="panel"><h2>运行历史（${runs.length} 条）</h2>
      <div style="padding:10px 15px" class="row">
        <input type="text" id="rf-job" placeholder="按 job_id 过滤" value="${esc(jobId)}" style="width:200px">
        <select id="rf-status">
          <option value="">全部状态</option>
          ${["success","failed","resource","preempted","preempt_failed","timeout","killed","interrupted"]
            .map(s=>`<option ${s===status?"selected":""}>${s}</option>`).join("")}
        </select>
        <button class="act" id="rf-go">查询</button></div>
      <table><thead><tr><th>job</th><th>状态</th><th>exit</th><th>trigger</th><th>attempt</th><th>原因</th><th>时刻</th><th>操作</th></tr></thead>
      <tbody>${pg.rows.map(r=>`<tr>
        <td class="mono">${esc(r.job_id)}</td><td>${badge(r.status)}</td><td>${esc(r.exit_code)}</td>
        <td>${esc(r.trigger)}</td><td>${esc(r.attempt)}</td>
        <td class="hint" style="max-width:300px">${esc((r.reason||"").slice(0,100))}</td>
        <td class="mono">${esc(r.finished_at||r.started_at||"")}</td>
        <td><button class="act" data-rd="${esc(r.job_id)}|${esc(r.run_id)}">详情/日志</button>
            <button class="act danger" data-del="${esc(r.job_id)}|${esc(r.run_id)}">删除</button></td></tr>`).join("")
        ||'<tr><td colspan="8" class="hint" style="padding:16px">无记录</td></tr>'}</tbody></table>
      ${runs.length > PAGE_SIZE ? pagerHtml(runs.length, pg.p, pg.pages, "runs") : ""}</div>`;
    $("#rf-go").onclick = () => { PG.runs = 1; loadTab(); };
    $("#rf-job").onkeydown = e => { if (e.key==="Enter") { PG.runs = 1; loadTab(); } };
    $("#rf-status").onchange = () => { PG.runs = 1; loadTab(); };
    document.querySelectorAll("[data-rd]").forEach(b => b.onclick = () => {
      const [j,rid] = b.dataset.rd.split("|"); openRun(j,rid);
    });
    document.querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
      const [j,rid] = b.dataset.del.split("|"); askDelete(j,rid);
    });
    bindPager(render);
  };
  render();
}

async function tabDecisions() {
  const items = await api("/api/decisions?limit=2000");
  const render = () => {
    const pg = pageSlice(items, "decisions");
    $("#view").innerHTML = `<div class="panel"><h2>调度决策记录（最近 ${items.length} 条）</h2>
    <table><thead><tr><th>时刻</th><th>动作</th><th>job/run</th><th>详情</th></tr></thead><tbody>
    ${pg.rows.map(d=>`<tr><td class="mono">${esc(d.ts||"")}</td>
      <td><span class="badge ${d.act==="terminal"||/giveup/.test(d.act)?"b-err":/enqueue|admit/.test(d.act)?"b-blue":/preempt/.test(d.act)?"b-warn":"b-dim"}">${esc(d.act)}</span></td>
      <td class="mono">${esc(d.job_id||"")} ${d.run_id?`<span class="hint">${esc(d.run_id)}</span>`:""}</td>
      <td class="hint" style="max-width:520px">${esc(JSON.stringify(Object.fromEntries(Object.entries(d).filter(([k])=>!["ts","act","job_id","run_id"].includes(k)))))}</td></tr>`).join("")
      ||'<tr><td colspan="4" class="hint" style="padding:16px">无决策记录</td></tr>'}</tbody></table>
    ${items.length > PAGE_SIZE ? pagerHtml(items.length, pg.p, pg.pages, "decisions") : ""}</div>`;
    bindPager(render);
  };
  render();
}

async function tabProfiles() {
  const p = await api("/api/profiles");
  $("#view").innerHTML = `<div class="panel"><h2>资源画像
    <span class="spacer"></span><span class="hint">注册冒烟 + 运行中动态采样（约每分钟）+ 终态采样；P95 滑窗 8 次 ×1.2 用于准出；预估时长（成功 run 中位数）用于同优先级 SJF</span></h2>
    <table><thead><tr><th>job</th><th>声明 CPU/内存</th><th>P95 CPU</th><th>P95 内存</th><th>预估时长</th><th>样本数</th></tr></thead>
    <tbody>${Object.entries(p).map(([k,d])=>`<tr><td class="mono">${esc(k)}</td>
      <td>${d.declared_cpu} 核 / ${d.declared_memory_mb}MB</td>
      <td>${d.p95_cpu??"-"} 核</td><td>${d.p95_memory_mb??"-"}MB</td>
      <td>${fmtDuration(d.p50_duration_sec)}</td>
      <td>${d.samples}（时长 ${d.duration_samples||0}）</td></tr>`).join("")
      ||'<tr><td colspan="6" class="hint" style="padding:16px">尚无画像（未注册过任务）</td></tr>'}</tbody></table></div>`;
}

const TABS = {overview:tabOverview, jobs:tabJobs, queue:tabQueue, runs:tabRuns,
              decisions:tabDecisions, profiles:tabProfiles};
let cur = "overview";
async function loadTab() {
  try { await TABS[cur](); } catch(e) { $("#view").innerHTML =
    `<div class="panel" style="padding:20px"><b style="color:var(--err)">加载失败：</b>${esc(e.message)}</div>`; }
}
document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  cur = b.dataset.tab;
  document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("active",x===b));
  loadTab();
});

const tick = async () => {
  try { const d = await fetch("/api/overview").then(r=>r.json());
    $("#meta").textContent = `jobs=${d.jobs} · waiting=${d.waiting} · running=${d.running} · ${d.started_at||""}`;
    if (cur === "overview" || cur === "queue") {
      // 用户正在表单/过滤框里输入时不自动重绘，避免冲掉焦点和未保存内容
      const ae = document.activeElement;
      const editing = ae && ["INPUT","TEXTAREA","SELECT"].includes(ae.tagName) && $("#view").contains(ae);
      const modalOpen = $(".modal-bg");
      if (!editing && !modalOpen) loadTab();
    }
  } catch { $("#meta").textContent = "管理台未连接（serve 是否带 --web 启动？）"; }
};
tick(); setInterval(tick, 3000);
</script>
