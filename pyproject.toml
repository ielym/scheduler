[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sched"
version = "3.0.0"
description = "常驻单进程本地任务调度器：生产者/执行分离、SQLite 执行库、动态运行目标与优先级保护"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
]

[project.scripts]
sched = "sched.__main__:main"

[tool.setuptools]
packages = ["sched", "sched_task_sdk"]
include-package-data = true
